worker_processes auto;
# Non-root, read-only rootfs: pid file and worker temp dirs must live on
# writable tmpfs mounts (see docker-compose.yml tmpfs entries).
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Writable scratch dirs, all on tmpfs per docker-compose.yml.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    sendfile        on;
    keepalive_timeout  65;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/xml application/xml;

    # Never leak nginx version in Server header or error pages.
    server_tokens off;

    server {
        listen 9006;
        listen [::]:9006;
        server_name anthropic-quiz.shiftuia.com anthropic-quiz.thinkcentre.local;

        root /usr/share/nginx/html;
        index index.html;

        autoindex off;

        # Behind Traefik/the tunnel, this container is only ever reached via
        # a Host header + path that don't include its internal port 9006.
        # nginx's default absolute redirects (e.g. the bare-path -> trailing
        # slash 301 below) would otherwise echo back
        # "http://<host>:9006/<path>/", which is unreachable from the
        # internet (wrong scheme, internal-only port). Keep all redirects
        # scheme-relative and port-free.
        absolute_redirect off;

        # Static study site, zero network calls from the built bundle
        # (VITE_RESULTS_ADAPTER=noop, VITE_EMAIL_ADAPTER=noop) — tight CSP.
        # 'unsafe-inline' on style-src only: the built bundle emits inline
        # style="..." attributes (checked the dist output directly), not an
        # injected <style> tag; no inline/eval script anywhere.
        #
        # NOTE: nginx's add_header does NOT inherit into a location block
        # that defines its own add_header — the location-level directive
        # resets the whole inherited set, it doesn't merge. So these five
        # headers must be repeated in every location block below rather
        # than declared once here (kept as a documented block for
        # reference/copy-paste, not actually applied at this level).
        # security_headers (repeated per-location, see below):
        #   Content-Security-Policy, X-Content-Type-Options, X-Frame-Options,
        #   Referrer-Policy, Permissions-Policy

        location = /health {
            limit_except GET HEAD { deny all; }
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            add_header Content-Type text/plain always;
            return 200 "ok";
        }

        # Hashed build assets: long-lived immutable cache.
        location /assets/ {
            limit_except GET HEAD { deny all; }
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        # Every top-level route is its own static HTML page emitted by the
        # build (quiz/, exam/, cheat-sheet/, framework/, privacy/) — serve
        # index.html for a bare directory request, SPA-style fallback for
        # anything else unmatched. Only GET/HEAD are meaningful for a static
        # site; reject everything else outright (no upload path, no form
        # handling, ever).
        location / {
            limit_except GET HEAD { deny all; }
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            add_header Cache-Control "no-cache" always;
            try_files $uri $uri/ $uri/index.html /index.html;
        }

        error_page 404 /index.html;
    }
}
